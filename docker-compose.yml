version: '3.8'

services:
  api:
    build: .
    container_name: trust_assessment_api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1

  dashboard:
    build: .
    container_name: trust_assessment_ui
    command: streamlit run app/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    restart: unless-stopped
    depends_on:
      - api
    environment:
      - PYTHONUNBUFFERED=1
