[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trustlens"
version = "0.1.1"
description = "Evidence-grounded, multi-dimensional website trust assessment (local-first research prototype)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "TrustLens Team" }]
keywords = ["web security", "phishing", "trust", "privacy", "explainable-ai"]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "tldextract>=5.0",
  "dnspython>=2.6",
  "cryptography>=42",
  "Pillow>=10",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "xgboost>=2.0",
  "pandas>=2.2",
  "networkx>=3.2",
  "pytesseract>=0.3.10",
  "playwright>=1.42",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]
llm = ["ollama>=0.3"]

[project.scripts]
trustlens = "trustlens.cli:main"
trustlens-api = "trustlens.cli:serve"

[tool.setuptools.packages.find]
include = ["trustlens*"]

[tool.setuptools.package-data]
trustlens = [
  "data/*.dat",
  "data/knowledge/*.json",
  "web/*.html",
  "web/static/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
